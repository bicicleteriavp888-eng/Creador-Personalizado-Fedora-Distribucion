name: CI - Creador Personalizado

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      iso_url:
        description: "URL HTTPS directa de una ISO para prueba QEMU opcional"
        required: false
        type: string

permissions:
  contents: read

jobs:
  tests-and-static-audit:
    runs-on: ubuntu-24.04
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Obtener código
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Instalar herramientas de auditoría
        run: |
          sudo apt-get update
          sudo apt-get install -y xorriso grub-common squashfs-tools libegl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0
      - name: Instalar proyecto y pruebas
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: Compilar sintaxis Python
        run: python -m compileall -q core gui scripts main.py
      - name: Ejecutar pruebas
        run: pytest -q
      - name: Verificar checksums distribuidos
        run: sha256sum -c SHA256SUMS.txt

  qemu-iso-smoke:
    if: github.event_name == 'workflow_dispatch' && inputs.iso_url != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Obtener código
        uses: actions/checkout@v4
      - name: Preparar herramientas QEMU y auditoría
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 xorriso grub-common squashfs-tools ovmf
      - name: Descargar ISO indicada manualmente
        env:
          ISO_URL: ${{ inputs.iso_url }}
        run: |
          test -n "$ISO_URL"
          case "$ISO_URL" in https://*) ;; *) echo "La URL debe usar HTTPS"; exit 1 ;; esac
          curl --fail --location --retry 3 "$ISO_URL" -o /tmp/candidato.iso
      - name: Auditoría estructural rápida
        run: python scripts/validate_iso.py /tmp/candidato.iso --quick --report-dir laboratory-reports
      - name: Prueba de arranque BIOS/UEFI con QEMU TCG
        run: python scripts/validate_iso.py /tmp/candidato.iso --boot-mode dual --qemu --timeout 90 --report-dir laboratory-reports
      - name: Publicar informe de laboratorio
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iso-laboratory-report
          path: laboratory-reports/
          if-no-files-found: warn
